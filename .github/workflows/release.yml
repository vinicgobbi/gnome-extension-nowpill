# A cada push na main:
# Actions fixadas pelo SHA do commit (a tag fica no comentário): uma tag pode
# ser movida para outro código; o SHA, não. O Dependabot propõe as
# atualizações (.github/dependabot.yml).
#
#   1. test    — testes do modelo (GJS), sintaxe dos módulos e o
#                stylesheet-light.css em dia com o stylesheet.css
#   2. bump    — commitizen vê pelos Conventional Commits se há release (algum
#                feat/fix/BREAKING desde a última); se houver, a versão
#                inteira sobe um, como nas extensões do GNOME: atualiza o
#                "version-name" do metadata.json e o CHANGELOG.md, cria o commit
#                "bump: ..." e a tag vN (ver .cz.toml)
#   3. build   — empacota o zip da extensão com o nome que o gnome-extensions
#                pack dá (<uuid>.shell-extension.zip, o mesmo enviado ao
#                extensions.gnome.org), gera o atestado de proveniência
#                (verificável com "gh attestation verify") e sobe tudo como
#                artefato
#   4. release — publica a release da tag e apaga os artefatos
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    # O commit "bump:" criado pelo próprio workflow não dispara nova release.
    # Disparado à mão, só vale na main (senão criaria tag/release de outra branch).
    if: ${{ github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'bump:') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gjs
      - run: make test
      # Os módulos importam gi:// e resource://, que só existem dentro do
      # GNOME Shell: aqui, só a sintaxe.
      - run: for f in $(find nowpill@vinicgobbi.dev.br -name '*.js'); do node --check --input-type=module < "$f" || exit 1; done
      - name: stylesheet-light.css gerado
        run: |
          make styles
          git diff --exit-code -- nowpill@vinicgobbi.dev.br/stylesheet-light.css \
            || { echo "::error::rode make styles e comite o stylesheet-light.css"; exit 1; }

  bump:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.result.outputs.version }}
      bumped: ${{ steps.result.outputs.bumped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install commitizen==4.19.1
      - id: result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          current="$(cz version --project)"
          set +e
          next="$(cz bump --get-next)"
          code=$?
          set -e
          case "$code" in
            0) ;;
            3|21) next="$current" ;; # 3 = nenhum commit novo, 21 = só commits que não geram versão
            *) exit "$code" ;;
          esac
          if [ "$next" = "$current" ]; then
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum commit feat/fix/BREAKING desde a última versão: sem release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          version=$(( ${current%%.*} + 1 ))
          cz bump --yes "$version.0.0"
          git push --atomic origin HEAD:main "v$version"
          # Notas = seção da versão no CHANGELOG.md.
          awk -v h="## v$version " 'index($0, h) == 1 {on=1; next} on && /^## / {exit} on' CHANGELOG.md > release-notes.md
          echo "bumped=true" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nova versão: v$version" >> "$GITHUB_STEP_SUMMARY"
      - if: steps.result.outputs.bumped == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 1

  build:
    needs: bump
    if: needs.bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # assinatura Sigstore do atestado
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.bump.outputs.version }}
      # gnome-extensions (do gnome-shell) para o pack, glib-compile-schemas
      # para os schemas.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-shell libglib2.0-bin
      - name: Empacotar
        run: |
          make pack
          cd dist
          sha256sum nowpill@vinicgobbi.dev.br.shell-extension.zip > nowpill@vinicgobbi.dev.br.shell-extension.zip.sha256
      - name: Atestado de proveniência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/nowpill@vinicgobbi.dev.br.shell-extension.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nowpill-extension
          path: dist/
          retention-days: 1

  release:
    needs: [bump, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write # apagar os artefatos depois de publicar
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publicar release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.bump.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file dist/release-notes.md \
            dist/nowpill@vinicgobbi.dev.br.shell-extension.zip*
      - name: Apagar artefatos da action
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            nowpill-extension
            release-notes
