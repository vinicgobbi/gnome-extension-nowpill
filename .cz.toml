[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "commitizen"
version = "0.1.0"
tag_format = "v$version"
# O "version-name" do metadata.json acompanha a versão (o "version" inteiro
# é dado pelo extensions.gnome.org a cada envio).
version_files = ["nowbar@vinicgobbi.dev.br/metadata.json:version-name"]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
major_version_zero = true
